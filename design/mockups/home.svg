<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
<title>Home page</title>
<rect width="1000" height="560" fill="#ffffff"/>
<rect x="1" y="1" width="998" height="558" rx="10" fill="#ffffff" stroke="#777777" stroke-width="1.5"/><path d="M1 34 V11 a10 10 0 0 1 10 -10 H989 a10 10 0 0 1 10 10 V34 Z" fill="#e6e6e6"/><circle cx="16" cy="17" r="5" fill="#bdbdbd"/><circle cx="32" cy="17" r="5" fill="#bdbdbd"/><circle cx="48" cy="17" r="5" fill="#bdbdbd"/><rect x="70" y="8" width="910" height="18" rx="9" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.5"/><text x="82" y="21" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a8a8a" text-anchor="start">subletboard.onrender.com/</text><line x1="1" y1="34" x2="999" y2="34" stroke="#777777"/><line x1="1" y1="84" x2="999" y2="84" stroke="#cccccc"/><rect x="24" y="49" width="22" height="22" rx="5" fill="#c8102e" stroke="#c8102e" stroke-width="1.5"/><text x="54" y="66" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#333333" text-anchor="start">SubletBoard</text><text x="175" y="64" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">Find a Sublet</text><text x="293.2" y="64" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">Post a Sublet</text><text x="850" y="64" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">Log in</text><rect x="910" y="46" width="70" height="28" rx="6" fill="#c8102e" stroke="#c8102e" stroke-width="1.5"/><text x="945" y="65" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Sign up</text><text x="40" y="150" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#333333" text-anchor="start">Sublets and roommates for Northeastern students</text><text x="40" y="182" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8a8a8a" text-anchor="start">Going on co-op? Find someone to take your room. New to Boston? Find a short-term place near campus.</text><rect x="40" y="205" width="130" height="34" rx="6" fill="#c8102e" stroke="#c8102e" stroke-width="1.5"/><text x="105" y="227" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Find a sublet</text><text x="190" y="227" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c8102e" text-anchor="start">Post a sublet</text><text x="300" y="227" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#c8102e" text-anchor="start">Create an account</text><rect x="40" y="270" width="920" height="230" rx="6" fill="#fafafa" stroke="#9a9a9a" stroke-width="1.5"/><text x="64" y="306" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#333333" text-anchor="start">How to use SubletBoard</text><text x="64" y="345" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#333333" text-anchor="start">Looking for a room</text><text x="64" y="378" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">1.  Open Find a sublet.</text><text x="64" y="408" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">2.  Filter by neighborhood, rent, dates and furnished.</text><text x="64" y="438" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">3.  Click a listing to see the details.</text><text x="64" y="468" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">4.  Log in to see the poster's email.</text><text x="520" y="345" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#333333" text-anchor="start">Leaving Boston for a while</text><text x="520" y="378" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">1.  Create an account.</text><text x="520" y="408" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">2.  Post a sublet with rent, dates, photo and description.</text><text x="520" y="438" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">3.  Edit or delete it on My Listings.</text><text x="520" y="468" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">4.  Mark it as rented when the room is taken.</text><circle cx="960" cy="270" r="11" fill="#1f6feb"/><text x="960" y="274" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="40" y="530" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f6feb" text-anchor="start" font-style="italic">1  Step-by-step instructions on the home page (the app is usable without reading the README)</text>
</svg>
