<rect x="1" y="1" width="998" height="828" rx="10" fill="#ffffff" stroke="#777777" stroke-width="1.5"/><path d="M1 34 V11 a10 10 0 0 1 10 -10 H989 a10 10 0 0 1 10 10 V34 Z" fill="#e6e6e6"/><circle cx="16" cy="17" r="5" fill="#bdbdbd"/><circle cx="32" cy="17" r="5" fill="#bdbdbd"/><circle cx="48" cy="17" r="5" fill="#bdbdbd"/><rect x="70" y="8" width="910" height="18" rx="9" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.5"/><text x="82" y="21" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a8a8a" text-anchor="start">subletboard.onrender.com/roommates/new</text><line x1="1" y1="34" x2="999" y2="34" stroke="#777777"/><line x1="1" y1="84" x2="999" y2="84" stroke="#cccccc"/><rect x="24" y="49" width="22" height="22" rx="5" fill="#c8102e" stroke="#c8102e" stroke-width="1.5"/><text x="54" y="66" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#333333" text-anchor="start">SubletBoard</text><text x="175" y="64" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">Find a Sublet</text><text x="299.3" y="64" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">Post a Sublet</text><text x="423.6" y="64" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">Find a Roommate</text><text x="562.1" y="64" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">My Listings</text><text x="672.2" y="64" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#333333" text-anchor="start">My Profile</text><line x1="672.2" y1="72" x2="743.2" y2="72" stroke="#c8102e" stroke-width="2"/><text x="780" y="64" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8a8a8a" text-anchor="start">Hi, Priya Patel</text><rect x="910" y="46" width="70" height="28" rx="6" fill="#c8102e" stroke="#c8102e" stroke-width="1.5"/><text x="945" y="65" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Log out</text><text x="150" y="140" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#333333" text-anchor="start">Create my roommate profile</text><text x="150" y="168" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8a8a8a" text-anchor="start">Students who are logged in will see your name and email on your profile.</text><rect x="150" y="185" width="600" height="590" rx="6" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/><text x="174" y="214" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#333333" text-anchor="start">Monthly budget ($)</text><text x="174" y="231" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a8a8a" text-anchor="start">The most you can pay for your share of the rent.</text><rect x="174" y="238" width="264" height="32" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/><text x="184" y="259" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">1400</text><text x="478" y="214" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#333333" text-anchor="start">Move-in date</text><rect x="478" y="238" width="248" height="32" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/><text x="488" y="259" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">01/01/2027</text><text x="174" y="300" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#333333" text-anchor="start">Preferred neighborhoods</text><text x="174" y="317" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a8a8a" text-anchor="start">Choose up to 3.</text><rect x="174" y="328" width="13" height="13" rx="2" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/><text x="194" y="339" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">Allston</text><rect x="312" y="328" width="13" height="13" rx="2" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/><text x="332" y="339" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">Back Bay</text><rect x="450" y="328" width="13" height="13" rx="2" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/><text x="470" y="339" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">Brookline</text><rect x="588" y="328" width="13" height="13" rx="2" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/><text x="608" y="339" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">Cambridge</text><rect x="174" y="352" width="13" height="13" rx="2" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/><path d="M177 358 l3 3 l5 -6" stroke="#c8102e" stroke-width="2" fill="none"/><text x="194" y="363" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">Fenway</text><rect x="312" y="352" width="13" height="13" rx="2" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/><text x="332" y="363" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">Jamaica Plain</text><rect x="450" y="352" width="13" height="13" rx="2" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/><path d="M453 358 l3 3 l5 -6" stroke="#c8102e" stroke-width="2" fill="none"/><text x="470" y="363" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">Mission Hill</text><rect x="588" y="352" width="13" height="13" rx="2" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/><text x="608" y="363" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">South End</text><text x="174" y="392" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8a8a8a" text-anchor="start">… all 16 neighborhoods</text><text x="174" y="428" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#333333" text-anchor="start">Sleep schedule</text><rect x="174" y="436" width="264" height="32" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/><text x="184" y="457" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">Night owl</text><text x="422" y="457" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">▾</text><text x="478" y="428" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#333333" text-anchor="start">Pets</text><rect x="478" y="436" width="248" height="32" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/><text x="488" y="457" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">I have a pet</text><text x="710" y="457" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">▾</text><rect x="174" y="494" width="13" height="13" rx="2" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/><text x="194" y="505" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">I smoke</text><text x="174" y="540" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#333333" text-anchor="start">About me</text><text x="174" y="557" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a8a8a" text-anchor="start">Your program, habits, and what you want in a roommate.</text><rect x="174" y="564" width="552" height="110" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/><rect x="186" y="582" width="480" height="8" rx="4" fill="#dddddd"/><rect x="186" y="602" width="420" height="8" rx="4" fill="#dddddd"/><rect x="186" y="622" width="300" height="8" rx="4" fill="#dddddd"/><text x="726" y="692" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a8a8a" text-anchor="end">168 / 500</text><rect x="174" y="712" width="130" height="34" rx="6" fill="#c8102e" stroke="#c8102e" stroke-width="1.5"/><text x="239" y="734" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Create profile</text><rect x="312" y="712" width="90" height="34" rx="6" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/><text x="357" y="734" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#333333" text-anchor="middle">Cancel</text><circle cx="750" cy="185" r="11" fill="#1f6feb"/><text x="750" y="189" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="150" y="805" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f6feb" text-anchor="start" font-style="italic">1  The same form is used to edit (title "Edit my profile", button "Save changes"). Each student can have one profile.</text>
