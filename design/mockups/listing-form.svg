<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="1000" height="860">
<title>Post or edit a sublet</title>
<rect width="1000" height="860" fill="#ffffff"/>
<rect x="1" y="1" width="998" height="858" rx="10" fill="#ffffff" stroke="#777777" stroke-width="1.5"/><path d="M1 34 V11 a10 10 0 0 1 10 -10 H989 a10 10 0 0 1 10 10 V34 Z" fill="#e6e6e6"/><circle cx="16" cy="17" r="5" fill="#bdbdbd"/><circle cx="32" cy="17" r="5" fill="#bdbdbd"/><circle cx="48" cy="17" r="5" fill="#bdbdbd"/><rect x="70" y="8" width="910" height="18" rx="9" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.5"/><text x="82" y="21" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a8a8a" text-anchor="start">subletboard.onrender.com/sublets/new</text><line x1="1" y1="34" x2="999" y2="34" stroke="#777777"/><line x1="1" y1="84" x2="999" y2="84" stroke="#cccccc"/><rect x="24" y="49" width="22" height="22" rx="5" fill="#c8102e" stroke="#c8102e" stroke-width="1.5"/><text x="54" y="66" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#333333" text-anchor="start">SubletBoard</text><text x="175" y="64" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">Find a Sublet</text><text x="293.2" y="64" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#333333" text-anchor="start">Post a Sublet</text><line x1="293.2" y1="72" x2="384.2" y2="72" stroke="#c8102e" stroke-width="2"/><text x="411.4" y="64" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">My Listings</text><text x="790" y="64" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8a8a8a" text-anchor="start">Hi, Emily Chen</text><rect x="910" y="46" width="70" height="28" rx="6" fill="#c8102e" stroke="#c8102e" stroke-width="1.5"/><text x="945" y="65" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Log out</text><text x="150" y="140" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#333333" text-anchor="start">Post a sublet</text><text x="150" y="168" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8a8a8a" text-anchor="start">Students who are logged in will see your name and email on the listing.</text><rect x="150" y="185" width="600" height="620" rx="6" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/><text x="174" y="214" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#333333" text-anchor="start">Title</text><text x="174" y="231" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a8a8a" text-anchor="start">For example: Sunny room in Fenway, Jan–Jun</text><rect x="174" y="238" width="552" height="32" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/><text x="184" y="259" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">Sunny room in Fenway, Jan–Jun</text><text x="174" y="300" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#333333" text-anchor="start">Neighborhood</text><rect x="174" y="308" width="264" height="32" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/><text x="184" y="329" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">Fenway</text><text x="422" y="329" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">▾</text><text x="478" y="300" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#333333" text-anchor="start">Monthly rent ($)</text><rect x="478" y="308" width="264" height="32" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/><text x="488" y="329" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">1450</text><text x="174" y="370" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#333333" text-anchor="start">Start date</text><rect x="174" y="378" width="264" height="32" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/><text x="184" y="399" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">01/01/2027</text><text x="478" y="370" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#333333" text-anchor="start">End date</text><rect x="478" y="378" width="264" height="32" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/><text x="488" y="399" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">06/30/2027</text><text x="174" y="440" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#333333" text-anchor="start">Commute to campus (minutes)</text><rect x="174" y="448" width="264" height="32" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/><text x="184" y="469" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">10</text><rect x="478" y="459" width="13" height="13" rx="2" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/><path d="M481 465 l3 3 l5 -6" stroke="#c8102e" stroke-width="2" fill="none"/><text x="498" y="470" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">The room is furnished</text><text x="174" y="512" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#333333" text-anchor="start">Photo link (optional)</text><text x="174" y="529" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a8a8a" text-anchor="start">A link to a photo of the room, starting with https://</text><rect x="174" y="536" width="552" height="32" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/><text x="184" y="557" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">https://</text><text x="174" y="598" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#333333" text-anchor="start">Description</text><text x="174" y="615" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a8a8a" text-anchor="start">The apartment, roommates, utilities and anything else people should know.</text><rect x="174" y="622" width="552" height="110" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/><rect x="186" y="640" width="480" height="8" rx="4" fill="#dddddd"/><rect x="186" y="660" width="420" height="8" rx="4" fill="#dddddd"/><rect x="186" y="680" width="300" height="8" rx="4" fill="#dddddd"/><text x="726" y="750" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a8a8a" text-anchor="end">214 / 1000</text><rect x="174" y="762" width="120" height="34" rx="6" fill="#c8102e" stroke="#c8102e" stroke-width="1.5"/><text x="234" y="784" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Post listing</text><circle cx="770" cy="200" r="11" fill="#1f6feb"/><text x="770" y="204" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="786" y="196" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f6feb" text-anchor="start" font-style="italic">1  Same form for editing.</text><text x="786" y="212" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f6feb" text-anchor="start" font-style="italic">    Fields are filled in and the</text><text x="786" y="228" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f6feb" text-anchor="start" font-style="italic">    button says "Save changes".</text><text x="786" y="244" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f6feb" text-anchor="start" font-style="italic"></text><text x="786" y="260" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f6feb" text-anchor="start" font-style="italic">    Mistakes (missing title,</text><text x="786" y="276" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f6feb" text-anchor="start" font-style="italic">    end date before start date,</text><text x="786" y="292" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f6feb" text-anchor="start" font-style="italic">    bad photo link) show a</text><text x="786" y="308" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f6feb" text-anchor="start" font-style="italic">    message above the form.</text>
</svg>
