fffff" stroke="#8250df" stroke-width="1.5"/><text x="95.5" y="334" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8250df" text-anchor="middle">Night owl</text><rect x="141" y="320" width="79" height="20" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/><text x="180.5" y="334" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1a7f37" text-anchor="middle">Has a cat</text><rect x="226" y="320" width="86" height="20" rx="10" fill="#ffffff" stroke="#6e6e6e" stroke-width="1.5"/><text x="269" y="334" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6e6e6e" text-anchor="middle">Non-smoker</text><rect x="56" y="362" width="380" height="8" rx="4" fill="#dddddd"/><rect x="56" y="382" width="340" height="8" rx="4" fill="#dddddd"/><rect x="56" y="402" width="220" height="8" rx="4" fill="#dddddd"/><rect x="56" y="438" width="150" height="34" rx="6" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/><text x="131" y="460" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#333333" text-anchor="middle">Hide from search</text><rect x="214" y="438" width="120" height="34" rx="6" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/><text x="274" y="460" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#333333" text-anchor="middle">View profile</text><rect x="342" y="438" width="60" height="34" rx="6" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/><text x="372" y="460" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#333333" text-anchor="middle">Edit</text><rect x="410" y="438" width="60" height="34" rx="6" fill="#ffffff" stroke="#c8102e" stroke-width="1.5"/><text x="440" y="460" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#c8102e" text-anchor="middle">Delete</text><circle cx="470" cy="190" r="11" fill="#1f6feb"/><text x="470" y="194" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><rect x="520" y="180" width="440" height="140" rx="6" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.5"/><text x="536" y="206" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#8a8a8a" text-anchor="start">When hidden:</text><rect x="536" y="220" width="139" height="20" rx="10" fill="#ffffff" stroke="#6e6e6e" stroke-width="1.5"/><text x="605.5" y="234" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6e6e6e" text-anchor="middle">Hidden from search</text><rect x="536" y="256" width="150" height="34" rx="6" fill="#c8102e" stroke="#c8102e" stroke-width="1.5"/><text x="611" y="278" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Show in search</text><circle cx="950" cy="190" r="11" fill="#1f6feb"/><text x="950" y="194" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><rect x="520" y="340" width="440" height="150" rx="6" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.5"/><text x="536" y="366" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#8a8a8a" text-anchor="start">No profile yet:</text><text x="536" y="394" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">You do not have a roommate profile yet.</text><rect x="536" y="412" width="140" height="34" rx="6" fill="#c8102e" stroke="#c8102e" stroke-width="1.5"/><text x="606" y="434" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Create my profile</text><text x="40" y="520" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f6feb" text-anchor="start" font-style="italic">1  Hide from search keeps the profile but removes it from search. Delete asks for confirmation first.</text><text x="40" y="536" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f6feb" text-anchor="start" font-style="italic">2  Show in search puts it back, so Marcus can hide his profile after he finds a roommate and show it again next year.</text>
</svg>
