<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Illustration of a furnished bedroom">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d6f5"/>
      <stop offset="1" stop-color="#e3f2fd"/>
    </linearGradient>
  </defs>
  <rect width="600" height="290" fill="#dfe9f3"/>
  <rect y="290" width="600" height="110" fill="#b08968"/>
  <rect y="284" width="600" height="8" fill="#ffffff" opacity="0.8"/><g transform="translate(600 0) scale(-1 1)">
    <!-- window -->
    <rect x="70" y="50" width="150" height="120" rx="4" fill="#ffffff"/>
    <rect x="78" y="58" width="134" height="104" fill="url(#sky)"/>
    <rect x="143" y="58" width="4" height="104" fill="#ffffff"/>
    <rect x="78" y="108" width="134" height="4" fill="#ffffff"/>
    <rect x="62" y="168" width="166" height="8" rx="2" fill="#ffffff"/>
    <!-- picture on the wall -->
    <rect x="300" y="70" width="70" height="54" rx="3" fill="#ffffff"/>
    <rect x="306" y="76" width="58" height="42" fill="#264653" opacity="0.85"/>
    <circle cx="350" cy="88" r="6" fill="#ffffff" opacity="0.7"/>
    <!-- rug -->
    <ellipse cx="300" cy="345" rx="170" ry="30" fill="#8ab0ab"/>
    <!-- bed -->
    <rect x="300" y="170" width="240" height="18" rx="6" fill="#6b4f3a"/>
    <rect x="300" y="170" width="16" height="140" rx="4" fill="#6b4f3a"/>
    <rect x="316" y="230" width="230" height="56" rx="10" fill="#f8f9fa"/>
    <rect x="370" y="226" width="180" height="64" rx="12" fill="#c8553d"/>
    <rect x="330" y="214" width="56" height="26" rx="10" fill="#ffffff"/>
    <rect x="540" y="280" width="10" height="34" rx="3" fill="#6b4f3a"/>
    <rect x="316" y="280" width="10" height="34" rx="3" fill="#6b4f3a"/>
    <!-- desk, lamp, laptop -->
    <rect x="40" y="226" width="150" height="12" rx="3" fill="#8d6e63"/>
    <rect x="50" y="238" width="10" height="80" fill="#8d6e63"/>
    <rect x="170" y="238" width="10" height="80" fill="#8d6e63"/>
    <rect x="80" y="204" width="54" height="22" rx="3" fill="#495057"/>
    <rect x="76" y="224" width="62" height="4" rx="2" fill="#343a40"/>
    <rect x="160" y="186" width="4" height="40" fill="#343a40"/>
    <path d="M148 186 h28 l-6 -18 h-16 z" fill="#ffd166"/>
    <!-- plant -->
    <rect x="232" y="292" width="34" height="34" rx="4" fill="#d4a373"/>
    <ellipse cx="240" cy="276" rx="12" ry="22" fill="#52b788" transform="rotate(-20 240 276)"/>
    <ellipse cx="258" cy="274" rx="12" ry="24" fill="#40916c" transform="rotate(18 258 274)"/>
    <ellipse cx="249" cy="266" rx="10" ry="24" fill="#2d6a4f"/></g>
</svg>
